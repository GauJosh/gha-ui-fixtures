name: s06 timeout
run-name: s06 timeout (${{ inputs.outcome }})
on:
  workflow_dispatch:
    inputs:
      outcome:
        description: pass or fail
        type: choice
        options: [fail, pass]
        default: fail
permissions:
  contents: read
jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Wait for service
        env:
          OUTCOME: ${{ inputs.outcome }}
        run: |
          SECS=5
          if [ "$OUTCOME" = "fail" ]; then SECS=150; fi
          for i in $(seq 1 "$SECS"); do echo "waiting for fixture service... ${i}s"; sleep 1; done
